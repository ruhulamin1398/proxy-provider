# Air live-reload config — https://github.com/air-verse/air
# Used by `make dev` if air is installed.
root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 0
  exclude_dir = ["bin", "tmp", "vendor", ".git"]
  exclude_file = ["log.txt"]
  exclude_regex = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = false

[color]
  build = "yellow"
  main = "green"
  runner = "cyan"
  watcher = "magenta"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
